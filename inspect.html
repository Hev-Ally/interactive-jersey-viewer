<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vaughn Concha | 3D Jersey Showcase</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --charcoal: #1C1C1C;
      --black: #101010;
      --pink: #FF2B78;
      --lime: #C4FF00;
      --white: #F5F5F5;
      --muted: #929292;
      --line: rgba(245, 245, 245, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
    }

    button {
      font: inherit;
    }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #1C1C1C;
    }

    #viewer canvas {
      display: block;
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 70% 42%,
          transparent 30%,
          rgba(0, 0, 0, 0.12) 70%,
          rgba(0, 0, 0, 0.55) 100%
        ),
        linear-gradient(
          90deg,
          rgba(16, 16, 16, 0.55),
          transparent 48%,
          rgba(16, 16, 16, 0.08)
        );
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      min-height: 82px;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: linear-gradient(
        to bottom,
        rgba(16, 16, 16, 0.96),
        rgba(16, 16, 16, 0.72),
        transparent
      );
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--lime);
      color: var(--black);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--white);
    }

    .brand span {
      color: var(--pink);
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .header-label {
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: right;
    }

    .header-label::after {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-left: 10px;
      background: var(--lime);
      vertical-align: 1px;
    }

    .info {
      position: fixed;
      z-index: 4;
      left: 5%;
      top: 48%;
      transform: translateY(-50%);
      width: min(330px, 30vw);
      pointer-events: none;
    }

    .eyebrow {
      color: #B6B6B6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      margin-bottom: 18px;
    }

    .eyebrow span {
      color: var(--pink);
      padding: 0 5px;
    }

    .info h1 {
      font-size: clamp(38px, 5.2vw, 68px);
      line-height: 0.91;
      letter-spacing: -3.5px;
      margin: 0;
      color: var(--white);
      font-weight: 850;
      text-transform: uppercase;
    }

    .info h1 .accent {
      display: inline-block;
      margin-top: 5px;
      color: var(--pink);
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -3px;
      text-transform: none;
    }

    .line {
      width: 42px;
      height: 3px;
      background: var(--lime);
      margin: 23px 0 17px;
    }

    .info p {
      color: #B4B4B4;
      font-size: 15px;
      line-height: 1.8;
      max-width: 245px;
      margin: 0;
    }

    #status {
      position: fixed;
      z-index: 6;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 17px;
      color: var(--white);
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(196, 255, 0, 0.3);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(12px);
    }

    .bottom-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      min-height: 132px;
      padding: 26px 5% 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-top: 1px solid var(--line);
      background: linear-gradient(
        to top,
        rgba(16, 16, 16, 0.98),
        rgba(16, 16, 16, 0.9),
        rgba(16, 16, 16, 0.55)
      );
      backdrop-filter: blur(14px);
    }

    .design-info {
      min-width: 145px;
    }

    .design-number {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    #designName {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--white);
    }

    .navigation {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      min-width: 158px;
      height: 52px;
      padding: 0 19px;
      background: transparent;
      border: 1px solid rgba(245, 245, 245, 0.3);
      border-radius: 0;
      color: var(--white);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .nav-button:hover {
      background: var(--pink);
      color: var(--black);
      border-color: var(--pink);
      transform: translateY(-2px);
    }

    #nextBtn {
      background: var(--lime);
      color: var(--black);
      border-color: var(--lime);
    }

    #nextBtn:hover {
      background: var(--pink);
      border-color: var(--pink);
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: wait;
      transform: none;
    }

    .tools {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .tool-button {
      height: 48px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid rgba(245, 245, 245, 0.2);
      border-radius: 0;
      color: #D0D0D0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .tool-button:hover {
      background: var(--pink);
      color: var(--black);
      border-color: var(--pink);
    }

    .tool-button.active {
      background: var(--lime);
      color: var(--black);
      border-color: var(--lime);
    }

    .tool-button.active:hover {
      background: var(--pink);
      border-color: var(--pink);
    }

    button:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 3px;
    }

    @media (max-width: 900px) {
      .info {
        width: 270px;
        top: 43%;
      }

      .info h1 {
        font-size: clamp(34px, 6vw, 52px);
      }

      .bottom-panel {
        flex-wrap: wrap;
        justify-content: space-between;
        padding: 17px 5% 20px;
        gap: 13px;
      }

      .design-info {
        width: 100%;
        text-align: center;
      }

      .navigation,
      .tools {
        flex: 1 1 100%;
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .header {
        min-height: 70px;
        padding: 15px 5%;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
      }

      .brand {
        font-size: 12px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .header-label {
        max-width: 112px;
        font-size: 8px;
        line-height: 1.6;
        letter-spacing: 1px;
      }

      .header-label::after {
        width: 6px;
        height: 6px;
        margin-left: 5px;
      }

      .info {
        top: 18%;
        left: 5%;
        width: 235px;
        transform: none;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: 1.5px;
        margin-bottom: 11px;
      }

      .info h1 {
        font-size: clamp(32px, 9vw, 44px);
        letter-spacing: -2px;
      }

      .info h1 .accent {
        letter-spacing: -2px;
      }

      .line {
        margin: 13px 0 10px;
      }

      .info p {
        max-width: 205px;
        font-size: 12px;
        line-height: 1.65;
      }

      #status {
        top: 78px;
        font-size: 9px;
        letter-spacing: 1px;
        padding: 9px 12px;
      }

      .bottom-panel {
        padding: 16px 4% 19px;
        gap: 10px;
      }

      .design-number {
        font-size: 9px;
        margin-bottom: 7px;
      }

      #designName {
        font-size: 18px;
      }

      .navigation {
        gap: 6px;
      }

      .nav-button {
        flex: 1;
        min-width: 0;
        max-width: 155px;
        height: 46px;
        padding: 0 10px;
        font-size: 9px;
        letter-spacing: 0.5px;
      }

      .tools {
        gap: 5px;
      }

      .tool-button {
        flex: 1;
        min-width: 0;
        height: 43px;
        padding: 0 9px;
        font-size: 8px;
        letter-spacing: 0.2px;
      }
    }

    @media (max-width: 360px) {
      .info {
        width: 205px;
      }

      .info h1 {
        font-size: 30px;
      }

      .info p {
        display: none;
      }

      .tool-button {
        font-size: 7px;
      }
    }
  </style>
</head>

<body>

  <div id="viewer"></div>
  <div class="ambient-overlay"></div>

  <header class="header">
    <div class="brand-wrap">
      <div class="brand-mark">V</div>

      <div class="brand-copy">
        <div class="brand">VAUGHN<span>.</span>CONCHA</div>
        <div class="brand-subtitle">JUNIOR GRAPHIC DESIGNER</div>
      </div>
    </div>

    <div class="header-label">3D SPORTSWEAR SHOWCASE</div>
  </header>

  <section class="info">
    <div class="eyebrow">
      CUSTOM UNIFORM COLLECTION <span>/</span> 2026
    </div>

    <h1>
      DESIGN<br>
      <span class="accent">IN MOTION.</span>
    </h1>

    <div class="line"></div>

    <p>
      Explore custom basketball uniform designs
      through an interactive 3D experience.
    </p>
  </section>

  <div id="status">INITIALIZING STUDIO...</div>

  <section class="bottom-panel">

    <div class="design-info">
      <div class="design-number" id="designNumber">
        DESIGN 01 / 02
      </div>

      <div id="designName">Jersey 01</div>
    </div>

    <div class="navigation">
      <button class="nav-button" id="previousBtn">
        ← PREVIOUS DESIGN
      </button>

      <button class="nav-button" id="nextBtn">
        NEXT DESIGN →
      </button>
    </div>

    <div class="tools">
      <button class="tool-button active" id="rotateBtn">
        Ⅱ PAUSE ROTATION
      </button>

      <button class="tool-button" id="resetBtn">
        RESET VIEW
      </button>

      <button class="tool-button" id="fullscreenBtn">
        ⛶ FULLSCREEN
      </button>
    </div>

  </section>

  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


    // =====================================
    // SCENE
    // =====================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x1c1c1c);

    scene.fog = new THREE.Fog(0x1c1c1c, 18, 42);


    // =====================================
    // CAMERA
    // =====================================

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      150
    );

    const initialCameraPosition = new THREE.Vector3(
      2.5, 1.2, 3.5
    );

    camera.position.copy(initialCameraPosition);


    // =====================================
    // RENDERER
    // =====================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 0.95;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById('viewer').appendChild(renderer.domElement);


    // =====================================
    // ORBIT CONTROLS
    // =====================================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.target.set(0, 0.9, 0);

    controls.minDistance = 1.5;

    controls.maxDistance = 12;

    controls.autoRotate = true;

    controls.autoRotateSpeed = 0.65;


    // =====================================
    // STUDIO LIGHTING
    // =====================================

    const hemisphereLight = new THREE.HemisphereLight(
      0xd7d7df,
      0x171219,
      1.05
    );

    scene.add(hemisphereLight);


    // Neutral key light to preserve the original jersey colors.

    const keyLight = new THREE.DirectionalLight(
      0xfff1e8,
      2.0
    );

    keyLight.position.set(5, 9, 14);

    keyLight.castShadow = true;

    keyLight.shadow.mapSize.set(2048, 2048);

    keyLight.shadow.camera.left = -12;

    keyLight.shadow.camera.right = 12;

    keyLight.shadow.camera.top = 12;

    keyLight.shadow.camera.bottom = -12;

    keyLight.shadow.bias = -0.0005;

    scene.add(keyLight);


    // Soft neutral fill light.

    const fillLight = new THREE.DirectionalLight(
      0xc6c6d4,
      0.55
    );

    fillLight.position.set(-5, 4, 5);

    scene.add(fillLight);


    // Hot pink rim light.

    const rimLight = new THREE.DirectionalLight(
      0xff2b78,
      1.8
    );

    rimLight.position.set(-4, 5, -5);

    scene.add(rimLight);


    // Secondary pink studio light.

    const pinkLight = new THREE.PointLight(
      0xff2b78,
      2.2,
      10
    );

    pinkLight.position.set(-3, 2.5, 1);

    scene.add(pinkLight);


    // Neon lime accent light.

    const limeLight = new THREE.PointLight(
      0xc4ff00,
      0.7,
      8
    );

    limeLight.position.set(4, 1.5, -3);

    scene.add(limeLight);


    // =====================================
    // STUDIO ENVIRONMENT
    // =====================================

    const studioGroup = new THREE.Group();

    scene.add(studioGroup);


    // =====================================
    // STUDIO FLOOR
    // =====================================

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x242424,
      roughness: 0.48,
      metalness: 0.28
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      floorMaterial
    );

    floor.rotation.x = -Math.PI / 2;

    floor.position.y = -0.24;

    floor.receiveShadow = true;

    studioGroup.add(floor);


    // =====================================
    // DISPLAY PLATFORM
    // =====================================

    const platformMaterial = new THREE.MeshStandardMaterial({
      color: 0x292929,
      roughness: 0.38,
      metalness: 0.48
    });

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(1.65, 1.65, 0.12, 96),
      platformMaterial
    );

    platform.position.set(0, -0.18, 0);

    platform.receiveShadow = true;

    platform.castShadow = true;

    studioGroup.add(platform);


    // Pink accent ring around the platform.

    const pinkRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.58, 0.018, 8, 96),
      new THREE.MeshBasicMaterial({
        color: 0xff2b78
      })
    );

    pinkRing.rotation.x = Math.PI / 2;

    pinkRing.position.set(0, -0.105, 0);

    studioGroup.add(pinkRing);


    // Thin lime accent ring.

    const limeRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.72, 0.009, 8, 96),
      new THREE.MeshBasicMaterial({
        color: 0xc4ff00
      })
    );

    limeRing.rotation.x = Math.PI / 2;

    limeRing.position.set(0, -0.235, 0);

    studioGroup.add(limeRing);


    // =====================================
    // MODEL AND DESIGNS
    // =====================================

    const modelPath = './assets/Basketball+Kit.glb';

    const designs = [

      {
        name: 'Jersey 01',
        top: './assets/top.png',
        short: './assets/short.png'
      },

      {
        name: 'Jersey 02',
        top: './assets/top2.png',
        short: './assets/short2.png'
      }

    ];


    let model = null;

    let currentDesign = 0;

    let isChangingDesign = false;

    const textureCache = new Map();

    const textureLoader = new THREE.TextureLoader();

    const gltfLoader = new GLTFLoader();


    // =====================================
    // UI ELEMENTS
    // =====================================

    const status = document.getElementById('status');

    const designName = document.getElementById('designName');

    const designNumber = document.getElementById('designNumber');

    const previousBtn = document.getElementById('previousBtn');

    const nextBtn = document.getElementById('nextBtn');

    const rotateBtn = document.getElementById('rotateBtn');

    const resetBtn = document.getElementById('resetBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');


    // =====================================
    // TEXTURE LOADER
    // =====================================

    function loadTexture(path) {

      if (textureCache.has(path)) {

        return Promise.resolve(textureCache.get(path));

      }

      return new Promise((resolve, reject) => {

        textureLoader.load(

          path,

          texture => {

            texture.colorSpace = THREE.SRGBColorSpace;

            texture.flipY = false;

            texture.anisotropy =
              renderer.capabilities.getMaxAnisotropy();

            texture.needsUpdate = true;

            textureCache.set(path, texture);

            resolve(texture);

          },

          undefined,

          error => reject(error)

        );

      });

    }


    // =====================================
    // APPLY TEXTURE
    // =====================================

    function applyTexture(meshName, texture) {

      let found = false;

      model.traverse(object => {

        if (object.name === meshName) {

          found = true;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {

            material.map = texture;

            material.needsUpdate = true;

          });

        }

      });

      if (!found) {

        throw new Error('Mesh not found: ' + meshName);

      }

    }


    // =====================================
    // CHANGE DESIGN
    // =====================================

    async function changeDesign(index) {

      if (
        isChangingDesign ||
        !model ||
        index < 0 ||
        index >= designs.length
      ) return;

      isChangingDesign = true;

      previousBtn.disabled = true;

      nextBtn.disabled = true;

      status.textContent = 'LOADING DESIGN...';

      const selectedDesign = designs[index];

      try {

        const [topTexture, shortTexture] = await Promise.all([

          loadTexture(selectedDesign.top),

          loadTexture(selectedDesign.short)

        ]);

        applyTexture('3Jersey', topTexture);

        applyTexture('4Short', shortTexture);

        currentDesign = index;

        designName.textContent = selectedDesign.name;

        designNumber.textContent =
          'DESIGN ' +
          String(index + 1).padStart(2, '0') +
          ' / ' +
          String(designs.length).padStart(2, '0');

        status.textContent = 'DESIGN SUCCESSFULLY LOADED';

      } catch (error) {

        console.error('Texture loading error:', error);

        status.textContent = 'ERROR LOADING DESIGN - CHECK FILES';

      }

      previousBtn.disabled = false;

      nextBtn.disabled = false;

      isChangingDesign = false;

    }


    // =====================================
    // PREVIOUS / NEXT
    // =====================================

    previousBtn.addEventListener('click', () => {

      const index =
        (currentDesign - 1 + designs.length) % designs.length;

      changeDesign(index);

    });


    nextBtn.addEventListener('click', () => {

      const index =
        (currentDesign + 1) % designs.length;

      changeDesign(index);

    });


    // =====================================
    // AUTO ROTATION
    // =====================================

    rotateBtn.addEventListener('click', () => {

      controls.autoRotate = !controls.autoRotate;

      rotateBtn.classList.toggle(
        'active',
        controls.autoRotate
      );

      rotateBtn.textContent = controls.autoRotate
        ? 'Ⅱ PAUSE ROTATION'
        : '↻ RESUME ROTATION';

    });


    // =====================================
    // RESET CAMERA
    // =====================================

    resetBtn.addEventListener('click', () => {

      camera.position.copy(initialCameraPosition);

      controls.target.set(0, 0.9, 0);

      controls.update();

    });


    // =====================================
    // FULLSCREEN
    // =====================================

    fullscreenBtn.addEventListener('click', async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error('Fullscreen error:', error);

      }

    });


    document.addEventListener('fullscreenchange', () => {

      fullscreenBtn.textContent = document.fullscreenElement
        ? '✕ EXIT FULL'
        : '⛶ FULLSCREEN';

    });


    // =====================================
    // LOAD MODEL
    // =====================================

    gltfLoader.load(

      modelPath,

      async gltf => {

        model = gltf.scene;

        model.traverse(object => {

          if (object.isMesh) {

            object.castShadow = true;

            object.receiveShadow = true;

          }

        });

        // Preserve the existing automatic model grounding logic.
        model.updateMatrixWorld(true);

        const modelBounds = new THREE.Box3().setFromObject(model);

        const courtFloorY = -0.15;

        model.position.y += courtFloorY - modelBounds.min.y;

        model.updateMatrixWorld(true);

        scene.add(model);

        await changeDesign(0);

      },

      xhr => {

        if (xhr.total) {

          const progress = Math.round(
            (xhr.loaded / xhr.total) * 100
          );

          status.textContent =
            'LOADING 3D MODEL ' + progress + '%';

        }

      },

      error => {

        console.error('Model loading error:', error);

        status.textContent = 'FAILED TO LOAD 3D MODEL';

      }

    );


    // =====================================
    // RESPONSIVE
    // =====================================

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });


    // =====================================
    // ANIMATION
    // =====================================

    const animationClock = new THREE.Clock();

    function animate() {

      requestAnimationFrame(animate);

      animationClock.getDelta();

      controls.update();

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>

</html>
