
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Kit - GLB Inspection</title>

  <style>
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #182633;
    }

    #viewer {
      width: 100%;
      height: 65vh;
    }

    #texture-export {
      padding: 16px;
      background: #182633;
    }

    #texture-export button {
      padding: 12px 18px;
      margin: 6px;
      border: none;
      border-radius: 6px;
      background: #55BCEB;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
    }

    #texture-export button:hover {
      background: #8bd5f5;
    }

    #report {
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h2>Basketball Kit - GLB Inspection</h2>
    <p id="status">Loading model...</p>
  </header>

  <div id="viewer"></div>

  <div id="texture-export">
    <h3>Texture Export</h3>
    <p>Download the original jersey and shorts textures.</p>
  </div>

  <pre id="report">Waiting for model...</pre>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");
    const report = document.getElementById("report");
    const exportArea = document.getElementById("texture-export");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x263746);

    const camera = new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth / viewer.clientHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(5, 10, 7);
    scene.add(light);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    const textureLoader = new THREE.TextureLoader();

    function addTextureExport(model, meshName, fileName) {
      let targetMesh;

      model.traverse((object) => {
        if (object.isMesh && object.name === meshName) {
          targetMesh = object;
        }
      });

      if (!targetMesh) {
        status.textContent += ` Missing mesh: ${meshName}.`;
        return;
      }

      const material = Array.isArray(targetMesh.material)
        ? targetMesh.material[0]
        : targetMesh.material;

      const texture = material?.map;
      const image = texture?.image;

      if (!image) {
        status.textContent += ` Missing texture: ${meshName}.`;
        return;
      }

      const button = document.createElement("button");
      button.textContent = `Download ${fileName}`;

      button.addEventListener("click", () => {
        const canvas = document.createElement("canvas");

        canvas.width = image.naturalWidth || image.width;
        canvas.height = image.naturalHeight || image.height;

        const context = canvas.getContext("2d");

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        canvas.toBlob((blob) => {
          if (!blob) {
            status.textContent = "Texture export failed.";
            return;
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = url;
          link.download = fileName;
          link.click();

          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      });

      exportArea.appendChild(button);
    }

    function applyCustomTexture(model, meshName, filePath) {
      return new Promise((resolve, reject) => {
        textureLoader.load(
          filePath,

          (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.flipY = false;
            texture.needsUpdate = true;

            let targetFound = false;

            model.traverse((object) => {
              if (object.isMesh && object.name === meshName) {
                targetFound = true;

                const materials = Array.isArray(object.material)
                  ? object.material
                  : [object.material];

                materials.forEach((material) => {
                  material.map = texture;
                  material.needsUpdate = true;
                });
              }
            });

            if (targetFound) {
              resolve(meshName);
            } else {
              texture.dispose();
              reject(`Mesh not found: ${meshName}`);
            }
          },

          undefined,

          (error) => {
            console.error(error);
            reject(`Failed to load: ${filePath}`);
          }
        );
      });
    }

    loader.load(
      "./assets/Basketball%2BKit.glb",

      async (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        addTextureExport(model, "3Jersey", "Jersey3_D3.png");
        addTextureExport(model, "4Short", "Short_D3.png");

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);

        const maxDimension = Math.max(size.x, size.y, size.z);
        const distance = maxDimension * 2.2;

        camera.position.set(
          distance,
          distance * 0.6,
          distance
        );

        camera.near = maxDimension / 1000;
        camera.far = maxDimension * 100;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.update();

        const meshReport = [];
        const materialsSeen = new Set();

        model.traverse((object) => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach((material) => {
            materialsSeen.add(material);

            meshReport.push({
              mesh: object.name || "Unnamed Mesh",
              material: material.name || "Unnamed Material",
              geometry: object.geometry.type,
              vertices:
                object.geometry.attributes.position?.count ?? 0,

              uv: !!object.geometry.attributes.uv,

              hasColorMap: !!material.map,
              hasNormalMap: !!material.normalMap,
              hasRoughnessMap: !!material.roughnessMap,

              colorTexture: material.map?.name || "Unnamed Texture",

              textureWidth:
                material.map?.image?.width ??
                material.map?.source?.data?.width ??
                null,

              textureHeight:
                material.map?.image?.height ??
                material.map?.source?.data?.height ??
                null,

              textureColorSpace:
                material.map?.colorSpace || "None",

              materialType: material.type
            });
          });
        });

        const output = {
          model: "Basketball+Kit.glb",
          status: "Loaded successfully",
          meshCount: meshReport.length,
          materialCount: materialsSeen.size,
          dimensions: {
            x: size.x,
            y: size.y,
            z: size.z
          },
          meshes: meshReport
        };

        report.textContent = JSON.stringify(output, null, 2);

        status.textContent = "Applying custom uniform textures...";

        const results = await Promise.allSettled([
          applyCustomTexture(model, "3Jersey", "./assets/top.png"),
          applyCustomTexture(model, "4Short", "./assets/short.png")
        ]);

        const jerseyResult = results[0];
        const shortsResult = results[1];

        if (jerseyResult.status === "fulfilled" &&
            shortsResult.status === "fulfilled") {

          status.textContent =
            "SUCCESS! Custom jersey and shorts textures applied.";

        } else {
          const errors = results
            .filter(result => result.status === "rejected")
            .map(result => result.reason);

          status.textContent =
            "Texture application issue: " + errors.join(" | ");
        }
      },

      (progress) => {
        if (progress.total) {
          status.textContent =
            `Loading: ${Math.round(progress.loaded / progress.total * 100)}%`;
        }
      },

      (error) => {
        console.error(error);
        status.textContent = "Model loading failed.";
        report.textContent =
          "Check the browser console for the error details.";
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = viewer.clientWidth / viewer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    });
  </script>
</body>
</html>
