
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaughn Concha | 3D Jersey Showcase</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 50% 42%, #26313b 0%, #151d25 40%, #090d12 100%);
    }

    button {
      font: inherit;
    }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HEADER */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 27px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(
        to bottom,
        rgba(5,9,13,0.8),
        rgba(5,9,13,0)
      );
    }

    .brand {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .brand span {
      color: #9bd9ff;
    }

    .header-label {
      color: #aab5c0;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* LEFT INFORMATION */

    .info {
      position: fixed;
      z-index: 4;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      max-width: 290px;
    }

    .eyebrow {
      color: #9bd9ff;
      font-size: 10px;
      letter-spacing: 3px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .info h1 {
      font-size: clamp(32px, 5vw, 58px);
      line-height: 0.98;
      margin: 0 0 16px;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .info p {
      color: #aab5c0;
      font-size: 13px;
      line-height: 1.8;
      max-width: 240px;
    }

    .line {
      width: 42px;
      height: 2px;
      background: #9bd9ff;
      margin: 22px 0;
    }

    /* TOP STATUS */

    #status {
      position: fixed;
      z-index: 6;
      top: 105px;
      left: 50%;
      transform: translateX(-50%);
      color: #c7d0d8;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
    }

    /* BOTTOM PANEL */

    .bottom-panel {
      position: fixed;
      z-index: 5;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 25px 5% 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: linear-gradient(
        to top,
        rgba(5,9,13,0.95),
        rgba(5,9,13,0.65),
        transparent
      );
    }

    .design-info {
      min-width: 150px;
    }

    .design-number {
      font-size: 10px;
      color: #8d9ba8;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    #designName {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* NAVIGATION */

    .navigation {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-button {
      height: 46px;
      min-width: 125px;
      padding: 0 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.25s;
    }

    .nav-button:hover {
      color: #101820;
      background: #9bd9ff;
      border-color: #9bd9ff;
      transform: translateY(-2px);
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    /* VIEWER TOOLS */

    .tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-button {
      min-width: 45px;
      height: 42px;
      padding: 0 12px;
      color: #dbe3ea;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tool-button:hover,
    .tool-button.active {
      color: #101820;
      background: #9bd9ff;
      border-color: #9bd9ff;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {
      .header {
        padding: 20px 5%;
      }

      .header-label {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .info {
        top: 22%;
        left: 6%;
        transform: none;
      }

      .info h1 {
        font-size: 34px;
      }

      .info p {
        display: none;
      }

      .line {
        margin: 12px 0;
      }

      .bottom-panel {
        padding: 18px 5% 22px;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }

      .design-info {
        width: 100%;
        text-align: center;
      }

      .navigation {
        justify-content: center;
      }

      .tools {
        width: 100%;
        justify-content: center;
      }

      .nav-button {
        min-width: 110px;
      }

      #status {
        top: 90px;
      }
    }

    @media (max-width: 400px) {
      .tool-button {
        min-width: 40px;
        padding: 0 8px;
      }

      .nav-button {
        min-width: 100px;
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

  <div id="viewer"></div>

  <header class="header">
    <div class="brand">VAUGHN<span>.</span>CONCHA</div>
    <div class="header-label">3D SPORTSWEAR SHOWCASE</div>
  </header>

  <section class="info">
    <div class="eyebrow">CUSTOM UNIFORM COLLECTION</div>
    <h1>DESIGN<br>IN MOTION.</h1>
    <div class="line"></div>
    <p>
      Explore custom basketball uniform designs
      through an interactive 3D experience.
    </p>
  </section>

  <div id="status">INITIALIZING VIEWER...</div>

  <section class="bottom-panel">

    <div class="design-info">
      <div class="design-number" id="designNumber">
        DESIGN 01 / 02
      </div>

      <div id="designName">Jersey 01</div>
    </div>

    <div class="navigation">
      <button class="nav-button" id="previousBtn">
        ← PREVIOUS
      </button>

      <button class="nav-button" id="nextBtn">
        NEXT DESIGN →
      </button>
    </div>

    <div class="tools">

      <button class="tool-button" id="rotateBtn">
        ↻ ROTATE
      </button>

      <button class="tool-button" id="resetBtn">
        RESET VIEW
      </button>

      <button class="tool-button" id="fullscreenBtn">
        ⛶ FULLSCREEN
      </button>

    </div>

  </section>


  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


    // SCENE

    const scene = new THREE.Scene();


    // CAMERA

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const initialCameraPosition = new THREE.Vector3(2.5, 1.2, 3.5);

    camera.position.copy(initialCameraPosition);


    // RENDERER

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.15;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById('viewer').appendChild(renderer.domElement);


    // ORBIT CONTROLS

    const controls = new OrbitControls(camera, renderer.domElement);

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.target.set(0, 0.9, 0);

    controls.minDistance = 1.5;

    controls.maxDistance = 8;

    controls.autoRotate = false;

    controls.autoRotateSpeed = 2.0;


    // STUDIO LIGHTING

    const hemisphereLight = new THREE.HemisphereLight(
      0xdceeff,
      0x202631,
      2.0
    );

    scene.add(hemisphereLight);


    const mainLight = new THREE.DirectionalLight(
      0xffffff,
      3.0
    );

    mainLight.position.set(3, 5, 4);

    mainLight.castShadow = true;

    scene.add(mainLight);


    const fillLight = new THREE.DirectionalLight(
      0x9bd9ff,
      2.0
    );

    fillLight.position.set(-4, 2, 3);

    scene.add(fillLight);


    const rimLight = new THREE.DirectionalLight(
      0xffffff,
      3.0
    );

    rimLight.position.set(0, 3, -5);

    scene.add(rimLight);


    const bottomLight = new THREE.PointLight(
      0x427da8,
      25,
      10
    );

    bottomLight.position.set(0, -1, 2);

    scene.add(bottomLight);


    // FILE PATHS

    const modelPath = './assets/Basketball+Kit.glb';

    const designs = [

      {
        name: 'Jersey 01',
        top: './assets/top.png',
        short: './assets/short.png'
      },

      {
        name: 'Jersey 02',
        top: './assets/top2.png',
        short: './assets/short2.png'
      }

    ];


    // VARIABLES

    let model = null;

    let currentDesign = 0;

    let isChangingDesign = false;

    const textureCache = new Map();

    const textureLoader = new THREE.TextureLoader();

    const gltfLoader = new GLTFLoader();


    // ELEMENTS

    const status = document.getElementById('status');

    const designName = document.getElementById('designName');

    const designNumber = document.getElementById('designNumber');

    const previousBtn = document.getElementById('previousBtn');

    const nextBtn = document.getElementById('nextBtn');

    const rotateBtn = document.getElementById('rotateBtn');

    const resetBtn = document.getElementById('resetBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');


    // LOAD TEXTURE WITH CACHE

    function loadTexture(path) {

      if (textureCache.has(path)) {

        return Promise.resolve(textureCache.get(path));

      }

      return new Promise((resolve, reject) => {

        textureLoader.load(

          path,

          texture => {

            texture.colorSpace = THREE.SRGBColorSpace;

            texture.flipY = false;

            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            texture.needsUpdate = true;

            textureCache.set(path, texture);

            resolve(texture);

          },

          undefined,

          error => {

            reject(error);

          }

        );

      });

    }


    // APPLY TEXTURE

    function applyTexture(meshName, texture) {

      let found = false;

      model.traverse(object => {

        if (object.name === meshName) {

          found = true;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {

            material.map = texture;

            material.needsUpdate = true;

          });

        }

      });

      if (!found) {

        throw new Error('Mesh not found: ' + meshName);

      }

    }


    // CHANGE DESIGN

    async function changeDesign(index) {

      if (isChangingDesign || !model) return;

      isChangingDesign = true;

      previousBtn.disabled = true;

      nextBtn.disabled = true;

      status.textContent = 'LOADING DESIGN...';

      const selectedDesign = designs[index];

      try {

        const [topTexture, shortTexture] = await Promise.all([

          loadTexture(selectedDesign.top),

          loadTexture(selectedDesign.short)

        ]);

        applyTexture('3Jersey', topTexture);

        applyTexture('4Short', shortTexture);

        currentDesign = index;

        designName.textContent = selectedDesign.name;

        designNumber.textContent =
          'DESIGN ' +
          String(index + 1).padStart(2, '0') +
          ' / ' +
          String(designs.length).padStart(2, '0');

        status.textContent = 'DESIGN SUCCESSFULLY LOADED';

        setTimeout(() => {

          status.textContent = 'INTERACTIVE 3D VIEWER';

        }, 2000);

      } catch (error) {

        console.error('Texture loading error:', error);

        status.textContent = 'ERROR LOADING DESIGN - CHECK FILES';

      }

      previousBtn.disabled = false;

      nextBtn.disabled = false;

      isChangingDesign = false;

    }


    // PREVIOUS DESIGN

    previousBtn.addEventListener('click', () => {

      const previousIndex =
        (currentDesign - 1 + designs.length) % designs.length;

      changeDesign(previousIndex);

    });


    // NEXT DESIGN

    nextBtn.addEventListener('click', () => {

      const nextIndex =
        (currentDesign + 1) % designs.length;

      changeDesign(nextIndex);

    });


    // AUTO ROTATION

    rotateBtn.addEventListener('click', () => {

      controls.autoRotate = !controls.autoRotate;

      rotateBtn.classList.toggle(
        'active',
        controls.autoRotate
      );

      rotateBtn.textContent = controls.autoRotate
        ? 'Ⅱ PAUSE'
        : '↻ ROTATE';

    });


    // RESET CAMERA

    resetBtn.addEventListener('click', () => {

      camera.position.copy(initialCameraPosition);

      controls.target.set(0, 0.9, 0);

      controls.update();

    });


    // FULLSCREEN

    fullscreenBtn.addEventListener('click', async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error('Fullscreen error:', error);

      }

    });


    // FULLSCREEN BUTTON LABEL

    document.addEventListener('fullscreenchange', () => {

      fullscreenBtn.textContent = document.fullscreenElement
        ? '✕ EXIT FULL'
        : '⛶ FULLSCREEN';

    });


    // LOAD MODEL

    gltfLoader.load(

      modelPath,

      async gltf => {

        model = gltf.scene;

        model.traverse(object => {

          if (object.isMesh) {

            object.castShadow = true;

            object.receiveShadow = true;

          }

        });

        scene.add(model);

        await changeDesign(0);

      },

      xhr => {

        if (xhr.total) {

          const progress = Math.round(
            (xhr.loaded / xhr.total) * 100
          );

          status.textContent =
            'LOADING 3D MODEL ' + progress + '%';

        }

      },

      error => {

        console.error('Model loading error:', error);

        status.textContent = 'FAILED TO LOAD 3D MODEL';

      }

    );


    // RESIZE

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });


    // ANIMATION LOOP

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>
</html>
