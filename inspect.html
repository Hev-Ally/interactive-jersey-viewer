
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Basketball Jersey Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
    }

    .controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 18px;
      background: rgba(10, 15, 20, 0.88);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      z-index: 10;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 7px;
      background: #ffffff;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #9edcff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #designName {
      min-width: 115px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: rgba(0,0,0,0.65);
      border-radius: 7px;
      font-size: 13px;
      z-index: 10;
      text-align: center;
    }

    @media (max-width: 500px) {
      .controls {
        width: calc(100% - 24px);
        justify-content: center;
        gap: 8px;
        padding: 10px;
      }

      button {
        padding: 11px 14px;
      }

      #designName {
        min-width: 90px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div id="viewer"></div>

  <div id="status">Loading 3D model...</div>

  <div class="controls">
    <button id="previousBtn">← Previous</button>
    <span id="designName">Jersey 01 / 02</span>
    <button id="nextBtn">Next →</button>
  </div>

  <script type="module">

    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';


    // SCENE

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x101820);


    // CAMERA

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(2.5, 1.2, 3.5);


    // RENDERER

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById('viewer').appendChild(renderer.domElement);


    // CONTROLS

    const controls = new OrbitControls(camera, renderer.domElement);

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.9, 0);
    controls.minDistance = 1.5;
    controls.maxDistance = 8;


    // LIGHTING

    const ambientLight = new THREE.AmbientLight(0xffffff, 2);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(3, 5, 4);
    scene.add(directionalLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1);
    fillLight.position.set(-3, 2, -4);
    scene.add(fillLight);


    // FILE PATHS

    const modelPath = './assets/Basketball+Kit.glb';

    const designs = [
      {
        name: 'Jersey 01',
        top: './assets/top.png',
        short: './assets/short.png'
      },
      {
        name: 'Jersey 02',
        top: './assets/top2.png',
        short: './assets/short2.png'
      }
    ];


    // VARIABLES

    let model = null;
    let currentDesign = 0;
    let isChangingDesign = false;

    const textureLoader = new THREE.TextureLoader();
    const gltfLoader = new GLTFLoader();

    const status = document.getElementById('status');
    const designName = document.getElementById('designName');
    const previousBtn = document.getElementById('previousBtn');
    const nextBtn = document.getElementById('nextBtn');


    // LOAD TEXTURE

    function loadTexture(path) {
      return new Promise((resolve, reject) => {

        textureLoader.load(
          path,

          texture => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.flipY = false;
            texture.needsUpdate = true;

            resolve(texture);
          },

          undefined,

          error => {
            reject(error);
          }
        );

      });
    }


    // APPLY TEXTURE TO MESH

    function applyTexture(meshName, texture) {

      let found = false;

      model.traverse(object => {

        if (object.name === meshName) {

          found = true;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {
            material.map = texture;
            material.needsUpdate = true;
          });

        }

      });

      if (!found) {
        throw new Error('Mesh not found: ' + meshName);
      }

    }


    // CHANGE JERSEY DESIGN

    async function changeDesign(index) {

      if (isChangingDesign || !model) return;

      isChangingDesign = true;

      previousBtn.disabled = true;
      nextBtn.disabled = true;

      status.textContent = 'Changing jersey design...';

      const selectedDesign = designs[index];

      try {

        const [topTexture, shortTexture] = await Promise.all([
          loadTexture(selectedDesign.top),
          loadTexture(selectedDesign.short)
        ]);

        applyTexture('3Jersey', topTexture);
        applyTexture('4Short', shortTexture);

        currentDesign = index;

        designName.textContent =
          selectedDesign.name + ' / ' + designs.length;

        status.textContent =
          selectedDesign.name + ' loaded successfully!';

        setTimeout(() => {
          status.textContent = '3D Viewer Ready';
        }, 2000);

      } catch (error) {

        console.error('Texture loading error:', error);

        status.textContent =
          'Error loading design. Check your PNG files and mesh names.';

      }

      previousBtn.disabled = false;
      nextBtn.disabled = false;

      isChangingDesign = false;

    }


    // PREVIOUS BUTTON

    previousBtn.addEventListener('click', () => {

      const previousIndex =
        (currentDesign - 1 + designs.length) % designs.length;

      changeDesign(previousIndex);

    });


    // NEXT BUTTON

    nextBtn.addEventListener('click', () => {

      const nextIndex =
        (currentDesign + 1) % designs.length;

      changeDesign(nextIndex);

    });


    // LOAD 3D MODEL

    gltfLoader.load(

      modelPath,

      async gltf => {

        model = gltf.scene;

        scene.add(model);

        await changeDesign(0);

      },

      xhr => {

        if (xhr.total) {
          const progress = Math.round(
            (xhr.loaded / xhr.total) * 100
          );

          status.textContent =
            'Loading 3D model... ' + progress + '%';
        }

      },

      error => {

        console.error('Model loading error:', error);

        status.textContent =
          'Failed to load 3D model. Check the GLB file path.';

      }

    );


    // RESPONSIVE

    window.addEventListener('resize', () => {

      camera.aspect = window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });


    // ANIMATION

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>
</html>
