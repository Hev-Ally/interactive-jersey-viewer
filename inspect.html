
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Kit - GLB Inspection</title>

  <style>
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #182633;
    }

    #viewer {
      width: 100%;
      height: 65vh;
    }

    #report {
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h2>Basketball Kit - GLB Inspection</h2>
    <p id="status">Loading model...</p>
  </header>

  <div id="viewer"></div>
  <pre id="report">Waiting for model...</pre>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    import { GLTFLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

    import { OrbitControls } from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";

    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");
    const report = document.getElementById("report");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x263746);

    const camera = new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth / viewer.clientHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(5, 10, 7);
    scene.add(light);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();

    loader.load(
      "./assets/Basketball%2BKit.glb",

      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);

        const maxDimension = Math.max(size.x, size.y, size.z);
        const distance = maxDimension * 2.2;

        camera.position.set(
          distance,
          distance * 0.6,
          distance
        );

        camera.near = maxDimension / 1000;
        camera.far = maxDimension * 100;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.update();

        const meshReport = [];
        const materialsSeen = new Set();

        model.traverse((object) => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach((material) => {
            materialsSeen.add(material);

            meshReport.push({
              mesh: object.name || "Unnamed Mesh",
              material: material.name || "Unnamed Material",
              geometry: object.geometry.type,
              vertices: object.geometry.attributes.position?.count ?? 0,
              uv: !!object.geometry.attributes.uv,
              uv1: !!object.geometry.attributes.uv1,
              hasColorMap: !!material.map,
              hasNormalMap: !!material.normalMap,
              hasRoughnessMap: !!material.roughnessMap,
              materialType: material.type
            });
          });
        });

        const output = {
          model: "Basketball+Kit.glb",
          status: "Loaded successfully",
          meshCount: meshReport.length,
          materialCount: materialsSeen.size,
          dimensions: {
            x: size.x,
            y: size.y,
            z: size.z
          },
          meshes: meshReport
        };

        status.textContent =
          "Model loaded successfully. Rotate and inspect it below.";

        report.textContent = JSON.stringify(output, null, 2);
      },

      (progress) => {
        if (progress.total) {
          status.textContent =
            `Loading: ${Math.round(progress.loaded / progress.total * 100)}%`;
        }
      },

      (error) => {
        console.error(error);
        status.textContent = "Model loading failed.";
        report.textContent =
          "Check the browser console for the error details.";
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = viewer.clientWidth / viewer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    });
  </script>
</body>
</html>
