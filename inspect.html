
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaughn Concha | 3D Jersey Showcase</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --cream: #F2EFE8;
      --charcoal: #1D211D;
      --coral: #F05A3D;
      --lime: #D5F45B;
      --beige: #E5E0D6;
      --muted: #85877F;
      --line: rgba(29, 33, 29, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--charcoal);
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
    }

    button {
      font: inherit;
    }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #viewer canvas {
      display: block;
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 45%,
        transparent 35%,
        rgba(29, 33, 29, 0.035) 82%,
        rgba(29, 33, 29, 0.12) 100%
      );
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      min-height: 82px;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: linear-gradient(
        to bottom,
        rgba(242, 239, 232, 0.97),
        rgba(242, 239, 232, 0.82),
        rgba(242, 239, 232, 0)
      );
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--charcoal);
      color: var(--cream);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--charcoal);
    }

    .brand span {
      color: var(--coral);
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 1.5px;
    }

    .header-label {
      color: var(--charcoal);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: right;
    }

    .header-label::after {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-left: 10px;
      background: var(--lime);
      border-radius: 50%;
      vertical-align: 1px;
    }

    .info {
      position: fixed;
      z-index: 4;
      left: 5%;
      top: 48%;
      transform: translateY(-50%);
      width: min(330px, 30vw);
      pointer-events: none;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.5px;
      margin-bottom: 18px;
    }

    .eyebrow span {
      color: var(--coral);
      padding: 0 5px;
    }

    .info h1 {
      font-size: clamp(38px, 5.2vw, 68px);
      line-height: 0.91;
      letter-spacing: -3.5px;
      margin: 0;
      color: var(--charcoal);
      font-weight: 850;
      text-transform: uppercase;
    }

    .info h1 .accent {
      display: inline-block;
      margin-top: 5px;
      color: var(--coral);
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -3px;
      text-transform: none;
    }

    .line {
      width: 42px;
      height: 3px;
      background: var(--lime);
      margin: 23px 0 17px;
    }

    .info p {
      color: #666A62;
      font-size: 12px;
      line-height: 1.85;
      max-width: 245px;
      margin: 0;
    }

    #status {
      position: fixed;
      z-index: 6;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 13px;
      color: var(--cream);
      background: rgba(29, 33, 29, 0.88);
      border: 1px solid rgba(242, 239, 232, 0.28);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    .bottom-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      min-height: 112px;
      padding: 22px 5% 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-top: 1px solid var(--line);
      background: linear-gradient(
        to top,
        rgba(242, 239, 232, 0.98),
        rgba(242, 239, 232, 0.92),
        rgba(242, 239, 232, 0.72)
      );
      backdrop-filter: blur(10px);
    }

    .design-info {
      min-width: 145px;
    }

    .design-number {
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    #designName {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--charcoal);
    }

    .navigation {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      min-width: 132px;
      height: 44px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid rgba(29, 33, 29, 0.28);
      border-radius: 0;
      color: var(--charcoal);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .nav-button:hover {
      background: var(--coral);
      color: #fff;
      border-color: var(--coral);
      transform: translateY(-2px);
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: wait;
      transform: none;
    }

    .tools {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .tool-button {
      height: 40px;
      padding: 0 12px;
      background: transparent;
      border: 1px solid rgba(29, 33, 29, 0.2);
      border-radius: 0;
      color: #555950;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .tool-button:hover {
      background: var(--charcoal);
      color: var(--cream);
      border-color: var(--charcoal);
    }

    .tool-button.active {
      background: var(--lime);
      color: var(--charcoal);
      border-color: var(--lime);
    }

    .tool-button.active:hover {
      background: var(--charcoal);
      color: var(--lime);
      border-color: var(--charcoal);
    }

    button:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 3px;
    }

    @media (max-width: 900px) {
      .info {
        width: 270px;
        top: 43%;
      }

      .info h1 {
        font-size: clamp(34px, 6vw, 52px);
      }

      .bottom-panel {
        flex-wrap: wrap;
        justify-content: space-between;
        padding: 17px 5% 20px;
        gap: 13px;
      }

      .design-info {
        width: 100%;
        text-align: center;
      }

      .navigation,
      .tools {
        flex: 1 1 100%;
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .header {
        min-height: 70px;
        padding: 15px 5%;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
      }

      .brand {
        font-size: 10px;
      }

      .brand-subtitle {
        font-size: 7px;
      }

      .header-label {
        max-width: 112px;
        font-size: 7px;
        line-height: 1.6;
        letter-spacing: 1px;
      }

      .header-label::after {
        width: 6px;
        height: 6px;
        margin-left: 5px;
      }

      .info {
        top: 18%;
        left: 5%;
        width: 235px;
        transform: none;
      }

      .eyebrow {
        font-size: 7px;
        letter-spacing: 1.5px;
        margin-bottom: 11px;
      }

      .info h1 {
        font-size: clamp(32px, 9vw, 44px);
        letter-spacing: -2px;
      }

      .info h1 .accent {
        letter-spacing: -2px;
      }

      .line {
        margin: 13px 0 10px;
      }

      .info p {
        max-width: 205px;
        font-size: 10px;
        line-height: 1.6;
      }

      #status {
        top: 78px;
        font-size: 7px;
        letter-spacing: 1px;
        padding: 7px 9px;
      }

      .bottom-panel {
        padding: 13px 4% 16px;
        gap: 10px;
      }

      .design-number {
        font-size: 7px;
        margin-bottom: 5px;
      }

      #designName {
        font-size: 15px;
      }

      .navigation {
        gap: 6px;
      }

      .nav-button {
        flex: 1;
        min-width: 0;
        max-width: 155px;
        height: 39px;
        padding: 0 8px;
        font-size: 8px;
        letter-spacing: 0.5px;
      }

      .tools {
        gap: 5px;
      }

      .tool-button {
        flex: 1;
        min-width: 0;
        height: 36px;
        padding: 0 7px;
        font-size: 7px;
        letter-spacing: 0.2px;
      }
    }

    @media (max-width: 360px) {
      .info {
        width: 205px;
      }

      .info h1 {
        font-size: 30px;
      }

      .info p {
        display: none;
      }

      .tool-button {
        font-size: 6px;
      }
    }
  </style>
</head>

<body>

  <div id="viewer"></div>
  <div class="ambient-overlay"></div>

  <header class="header">
    <div class="brand-wrap">
      <div class="brand-mark">V</div>
      <div class="brand-copy">
        <div class="brand">VAUGHN<span>.</span>CONCHA</div>
        <div class="brand-subtitle">JUNIOR GRAPHIC DESIGNER</div>
      </div>
    </div>
    <div class="header-label">3D SPORTSWEAR SHOWCASE</div>
  </header>

  <section class="info">
    <div class="eyebrow">CUSTOM UNIFORM COLLECTION <span>/</span> 2026</div>
    <h1>DESIGN<br><span class="accent">IN MOTION.</span></h1>
    <div class="line"></div>
    <p>
      Explore custom basketball uniform designs
      through an interactive 3D experience.
    </p>
  </section>

  <div id="status">INITIALIZING COURT...</div>

  <section class="bottom-panel">

    <div class="design-info">
      <div class="design-number" id="designNumber">
        DESIGN 01 / 02
      </div>
      <div id="designName">Jersey 01</div>
    </div>

    <div class="navigation">
      <button class="nav-button" id="previousBtn">
        ← PREVIOUS DESIGN
      </button>

      <button class="nav-button" id="nextBtn">
        NEXT DESIGN →
      </button>
    </div>

    <div class="tools">
      <button class="tool-button active" id="rotateBtn">Ⅱ PAUSE ROTATION</button>
      <button class="tool-button" id="resetBtn">RESET VIEW</button>
      <button class="tool-button" id="fullscreenBtn">⛶ FULLSCREEN</button>
    </div>

  </section>


  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


    // =====================================
    // SCENE
    // =====================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x9bc9df);

    scene.fog = new THREE.Fog(0xb8d5df, 28, 62);

    // CREATIVE SKY DOME - soft blue-to-sunset gradient
    const skyGeometry = new THREE.SphereGeometry(95, 48, 32);

    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        sunDirection: { value: new THREE.Vector3(0.30, 0.48, 0.82).normalize() }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 sunDirection;
        varying vec3 vWorldPosition;
        void main() {
          vec3 viewDirection = normalize(vWorldPosition - cameraPosition);
          float height = max(viewDirection.y, 0.0);
          vec3 horizon = vec3(0.96, 0.78, 0.63);
          vec3 middleSky = vec3(0.48, 0.72, 0.83);
          vec3 zenith = vec3(0.22, 0.48, 0.68);
          vec3 skyColor = mix(horizon, middleSky, smoothstep(0.02, 0.38, height));
          skyColor = mix(skyColor, zenith, smoothstep(0.38, 0.92, height));
          float sunGlow = pow(max(dot(viewDirection, sunDirection), 0.0), 18.0);
          float sunCore = pow(max(dot(viewDirection, sunDirection), 0.0), 180.0);
          skyColor += vec3(0.20, 0.12, 0.06) * sunGlow;
          skyColor += vec3(0.28, 0.19, 0.10) * sunCore;
          gl_FragColor = vec4(skyColor, 1.0);
        }
      `
    });

    const skyDome = new THREE.Mesh(skyGeometry, skyMaterial);
    skyDome.renderOrder = -10;
    scene.add(skyDome);


    // =====================================
    // CAMERA
    // =====================================

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      150
    );

    const initialCameraPosition = new THREE.Vector3(
      2.5, 1.2, 3.5
    );

    camera.position.copy(initialCameraPosition);


    // =====================================
    // RENDERER
    // =====================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 0.95;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById('viewer').appendChild(renderer.domElement);


    // =====================================
    // ORBIT CONTROLS
    // =====================================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.target.set(0, 0.9, 0);

    controls.minDistance = 1.5;

    controls.maxDistance = 12;

    // Start the full showcase in a slow automatic orbit.
    controls.autoRotate = true;

    controls.autoRotateSpeed = 0.65;


    // =====================================
    // LIGHTING - LATE AFTERNOON
    // =====================================

    const hemisphereLight = new THREE.HemisphereLight(
      0xc8e7f5,
      0x8c806c,
      1.15
    );

    scene.add(hemisphereLight);


    const keyLight = new THREE.DirectionalLight(
      0xffe0b5,
      2.0
    );

    keyLight.position.set(5, 9, 14);

    keyLight.castShadow = true;

    keyLight.shadow.mapSize.set(2048, 2048);

    keyLight.shadow.camera.left = -12;

    keyLight.shadow.camera.right = 12;

    keyLight.shadow.camera.top = 12;

    keyLight.shadow.camera.bottom = -12;

    keyLight.shadow.bias = -0.0005;




    const fillLight = new THREE.DirectionalLight(
      0x9bc9e3,
      0.55
    );

    fillLight.position.set(5, 4, 4);

    scene.add(fillLight);


    const rimLight = new THREE.DirectionalLight(
      0xffd6a0,
      0.75
    );

    rimLight.position.set(0, 5, -5);

    scene.add(rimLight);


    const softLight = new THREE.PointLight(
      0xffd9ae,
      3,
      12
    );

    softLight.position.set(0, 3, 2);

    scene.add(softLight);


    // =====================================
    // OUTDOOR ENVIRONMENT GROUP
    // =====================================

    const studioGroup = new THREE.Group();

    scene.add(studioGroup);

    // Keep the shadow-casting light aligned with the visible sun.
    keyLight.target.position.set(0, -0.15, 0);
    studioGroup.add(keyLight);
    studioGroup.add(keyLight.target);


    // SOFT STYLIZED CLOUDS - gently drifting across the sky
    const cloudMaterial = new THREE.MeshBasicMaterial({
      color: 0xf4f0e7,
      transparent: true,
      opacity: 0.72,
      depthWrite: false
    });

    const movingClouds = [];

    function createCloud(x, y, z, scale = 1, speed = 0.22) {
      const cloud = new THREE.Group();
      cloud.position.set(x, y, z);
      cloud.scale.setScalar(scale);

      [
        [-0.9, 0, 0, 0.72],
        [-0.25, 0.22, 0, 0.9],
        [0.55, 0.05, 0, 0.68],
        [1.05, -0.08, 0, 0.48]
      ].forEach(([cx, cy, cz, size]) => {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(size, 16, 12),
          cloudMaterial
        );
        puff.position.set(cx, cy, cz);
        cloud.add(puff);
      });

      scene.add(cloud);
      movingClouds.push({ cloud, speed, startX: x });
    }

    createCloud(-15, 9, -24, 1.25, 0.20);
    createCloud(15, 11, -30, 1.05, 0.15);
    createCloud(-19, 7, 12, 0.8, 0.24);
    createCloud(20, 8, 15, 0.9, 0.18);


    // =====================================
    // OUTDOOR GROUND
    // =====================================

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x8b9f82,
      roughness: 1,
      metalness: 0
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;

    ground.position.y = -0.24;

    ground.receiveShadow = true;

    studioGroup.add(ground);


    // =====================================
    // COURT FLOOR
    // =====================================

    const courtMaterial = new THREE.MeshStandardMaterial({
      color: 0x9dbfca,
      roughness: 0.92,
      metalness: 0.02
    });

    const court = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 34),
      courtMaterial
    );

    court.rotation.x = -Math.PI / 2;

    court.position.y = -0.15;

    court.receiveShadow = true;

    studioGroup.add(court);


    // =====================================
    // COURT MARKINGS
    // =====================================

    const lineMaterial = new THREE.MeshBasicMaterial({
      color: 0xf5f0df
    });


    function createCourtLine(points) {

      const geometry = new THREE.BufferGeometry();

      geometry.setFromPoints(
        points.map(p => new THREE.Vector3(p[0], -0.135, p[1]))
      );

      const line = new THREE.Line(
        geometry,
        lineMaterial
      );

      studioGroup.add(line);

      return line;

    }


    function createRectangle(x, z, width, depth) {

      createCourtLine([
        [x, z],
        [x + width, z],
        [x + width, z + depth],
        [x, z + depth],
        [x, z]
      ]);

    }


    // Outer boundary

    createRectangle(-9, -16, 18, 32);


    // Center line

    createCourtLine([
      [-9, 0],
      [9, 0]
    ]);


    // Center circle

    const centerCircle = new THREE.Mesh(
      new THREE.TorusGeometry(1.8, 0.018, 8, 96),
      lineMaterial
    );

    centerCircle.rotation.x = Math.PI / 2;

    centerCircle.position.set(0, -0.13, 0);

    studioGroup.add(centerCircle);


    // Basketball keys

    createRectangle(-3, -15, 6, 5.5);

    createRectangle(-3, 9.5, 6, 5.5);


    // Free throw circles

    [-9.5, 9.5].forEach(z => {

      const circle = new THREE.Mesh(
        new THREE.TorusGeometry(1.8, 0.018, 8, 64),
        lineMaterial
      );

      circle.rotation.x = Math.PI / 2;

      circle.position.set(0, -0.13, z);

      studioGroup.add(circle);

    });


    // =====================================
    // BASKETBALL HOOPS
    // =====================================

    const poleMaterial = new THREE.MeshStandardMaterial({
      color: 0x46545b,
      metalness: 0.65,
      roughness: 0.4
    });

    const backboardMaterial = new THREE.MeshStandardMaterial({
      color: 0xe8edf0,
      roughness: 0.35,
      metalness: 0.1
    });

    const rimMaterial = new THREE.MeshStandardMaterial({
      color: 0xe77d46,
      metalness: 0.4,
      roughness: 0.4
    });


    function createHoop(zDirection) {

      const hoop = new THREE.Group();

      const z = zDirection * 1;


      // Pole

      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.075, 0.1, 3.5, 16),
        poleMaterial
      );

      pole.position.set(0, 1.6, z * 15.1);

      hoop.add(pole);


      // Support arm

      const support = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.1, 1.0),
        poleMaterial
      );

      support.position.set(0, 3.0, z * 14.65);

      hoop.add(support);


      // Backboard

      const backboard = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 1.05, 0.08),
        backboardMaterial
      );

      backboard.position.set(0, 3.2, z * 14.25);

      hoop.add(backboard);


      // Target rectangle

      const target = new THREE.Mesh(
        new THREE.BoxGeometry(0.65, 0.42, 0.015),
        new THREE.MeshBasicMaterial({
          color: 0x7799a8
        })
      );

      target.position.set(0, 3.08, z * 14.19);

      hoop.add(target);


      // Rim

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.24, 0.025, 12, 48),
        rimMaterial
      );

      rim.rotation.x = Math.PI / 2;

      rim.position.set(0, 2.85, z * 13.9);

      hoop.add(rim);


      studioGroup.add(hoop);

    }


    createHoop(-1);

    createHoop(1);


    // =====================================
    // OUTDOOR FENCING
    // =====================================

    const fenceMaterial = new THREE.MeshStandardMaterial({
      color: 0x879ca5,
      metalness: 0.55,
      roughness: 0.7
    });


    function createFencePost(x, z) {

      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 4, 8),
        fenceMaterial
      );

      post.position.set(x, 1.85, z);

      studioGroup.add(post);

    }


    // Side fence posts

    for (let z = -15; z <= 15; z += 3) {

      createFencePost(-9.5, z);

      createFencePost(9.5, z);

    }


    // Horizontal fence rails

    [-9.5, 9.5].forEach(x => {

      [0.5, 2, 3.5].forEach(y => {

        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(0.045, 0.045, 30),
          fenceMaterial
        );

        rail.position.set(x, y, 0);

        studioGroup.add(rail);

      });

    });


    // CREATIVE COURTSIDE COLOR BANNERS
    const bannerColors = [0x4c9fc2, 0xf0a36b, 0x8da98c, 0xe4c978];

    [-9.48, 9.48].forEach((x, sideIndex) => {
      [-9, -3, 3, 9].forEach((z, bannerIndex) => {
        const banner = new THREE.Mesh(
          new THREE.PlaneGeometry(1.65, 0.72),
          new THREE.MeshStandardMaterial({
            color: bannerColors[(bannerIndex + sideIndex) % bannerColors.length],
            roughness: 0.9,
            side: THREE.DoubleSide
          })
        );
        banner.rotation.y = Math.PI / 2;
        banner.position.set(x, 2.85, z);
        studioGroup.add(banner);
      });
    });


    // =====================================
    // OUTDOOR TREES
    // =====================================

    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0x78604c
    });

    const leafMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0x718e75,
        roughness: 1
      }),
      new THREE.MeshStandardMaterial({
        color: 0x8ca17d,
        roughness: 1
      })
    ];


    function createTree(x, z, scale = 1) {

      const tree = new THREE.Group();

      // Place each tree base on the surrounding ground plane.
      tree.position.set(x, -0.24, z);

      tree.scale.setScalar(scale);


      // Tree trunk

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.18, 2.2, 10),
        trunkMaterial
      );

      trunk.position.y = 1.1;

      trunk.castShadow = true;

      tree.add(trunk);


      // Tree foliage

      const leaves = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1, 1),
        leafMaterials[Math.abs(Math.round(x + z)) % 2]
      );

      leaves.position.y = 2.5;

      leaves.scale.set(1.1, 1.35, 1.1);

      leaves.castShadow = true;

      tree.add(leaves);

      studioGroup.add(tree);

    }


    // Left trees

    createTree(-12, -11, 1.5);

    createTree(-13, -4, 1.2);

    createTree(-12, 5, 1.4);

    createTree(-12, 13, 1.3);


    // Right trees

    createTree(12, -10, 1.4);

    createTree(13, -2, 1.3);

    createTree(12, 7, 1.5);

    createTree(12, 14, 1.2);


    // =====================================
    // DISTANT SUN
    // =====================================

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffe2ad
      })
    );

    sun.position.set(5, 9, 14);

    studioGroup.add(sun);


    // =====================================
    // OUTDOOR ENVIRONMENT LIGHTS
    // =====================================

    const leftGlow = new THREE.PointLight(
      0xb4d5e3,
      2,
      12
    );

    leftGlow.position.set(-7, 3, -5);

    studioGroup.add(leftGlow);


    const rightGlow = new THREE.PointLight(
      0xffd5a4,
      2,
      12
    );

    rightGlow.position.set(7, 3, -5);

    studioGroup.add(rightGlow);


    // =====================================
    // MODEL AND DESIGNS
    // =====================================

    const modelPath = './assets/Basketball+Kit.glb';

    const designs = [

      {
        name: 'Jersey 01',
        top: './assets/top.png',
        short: './assets/short.png'
      },

      {
        name: 'Jersey 02',
        top: './assets/top2.png',
        short: './assets/short2.png'
      }

    ];


    let model = null;

    let currentDesign = 0;

    let isChangingDesign = false;

    const textureCache = new Map();

    const textureLoader = new THREE.TextureLoader();

    const gltfLoader = new GLTFLoader();


    // =====================================
    // UI ELEMENTS
    // =====================================

    const status = document.getElementById('status');

    const designName = document.getElementById('designName');

    const designNumber = document.getElementById('designNumber');

    const previousBtn = document.getElementById('previousBtn');

    const nextBtn = document.getElementById('nextBtn');

    const rotateBtn = document.getElementById('rotateBtn');

    const resetBtn = document.getElementById('resetBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');


    // =====================================
    // TEXTURE LOADER
    // =====================================

    function loadTexture(path) {

      if (textureCache.has(path)) {

        return Promise.resolve(textureCache.get(path));

      }

      return new Promise((resolve, reject) => {

        textureLoader.load(

          path,

          texture => {

            texture.colorSpace = THREE.SRGBColorSpace;

            texture.flipY = false;

            texture.anisotropy =
              renderer.capabilities.getMaxAnisotropy();

            texture.needsUpdate = true;

            textureCache.set(path, texture);

            resolve(texture);

          },

          undefined,

          error => reject(error)

        );

      });

    }


    // =====================================
    // APPLY TEXTURE
    // =====================================

    function applyTexture(meshName, texture) {

      let found = false;

      model.traverse(object => {

        if (object.name === meshName) {

          found = true;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {

            material.map = texture;

            material.needsUpdate = true;

          });

        }

      });

      if (!found) {

        throw new Error('Mesh not found: ' + meshName);

      }

    }


    // =====================================
    // CHANGE DESIGN
    // =====================================

    async function changeDesign(index) {

      if (
        isChangingDesign ||
        !model ||
        index < 0 ||
        index >= designs.length
      ) return;

      isChangingDesign = true;

      previousBtn.disabled = true;

      nextBtn.disabled = true;

      status.textContent = 'LOADING DESIGN...';

      const selectedDesign = designs[index];

      try {

        const [topTexture, shortTexture] = await Promise.all([

          loadTexture(selectedDesign.top),

          loadTexture(selectedDesign.short)

        ]);

        applyTexture('3Jersey', topTexture);

        applyTexture('4Short', shortTexture);

        currentDesign = index;

        designName.textContent = selectedDesign.name;

        designNumber.textContent =
          'DESIGN ' +
          String(index + 1).padStart(2, '0') +
          ' / ' +
          String(designs.length).padStart(2, '0');

        status.textContent = 'DESIGN SUCCESSFULLY LOADED';

      } catch (error) {

        console.error('Texture loading error:', error);

        status.textContent = 'ERROR LOADING DESIGN - CHECK FILES';

      }

      previousBtn.disabled = false;

      nextBtn.disabled = false;

      isChangingDesign = false;

    }


    // =====================================
    // PREVIOUS / NEXT
    // =====================================

    previousBtn.addEventListener('click', () => {

      const index =
        (currentDesign - 1 + designs.length) % designs.length;

      changeDesign(index);

    });


    nextBtn.addEventListener('click', () => {

      const index =
        (currentDesign + 1) % designs.length;

      changeDesign(index);

    });


    // =====================================
    // AUTO ROTATION
    // =====================================

    rotateBtn.addEventListener('click', () => {

      controls.autoRotate = !controls.autoRotate;

      rotateBtn.classList.toggle(
        'active',
        controls.autoRotate
      );

      rotateBtn.textContent = controls.autoRotate
        ? 'Ⅱ PAUSE ROTATION'
        : '↻ RESUME ROTATION';

    });


    // =====================================
    // RESET CAMERA
    // =====================================

    resetBtn.addEventListener('click', () => {

      camera.position.copy(initialCameraPosition);

      controls.target.set(0, 0.9, 0);

      controls.update();

    });


    // =====================================
    // FULLSCREEN
    // =====================================

    fullscreenBtn.addEventListener('click', async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error('Fullscreen error:', error);

      }

    });


    document.addEventListener('fullscreenchange', () => {

      fullscreenBtn.textContent = document.fullscreenElement
        ? '✕ EXIT FULL'
        : '⛶ FULLSCREEN';

    });


    // =====================================
    // LOAD MODEL
    // =====================================

    gltfLoader.load(

      modelPath,

      async gltf => {

        model = gltf.scene;

        model.traverse(object => {

          if (object.isMesh) {

            object.castShadow = true;

            object.receiveShadow = true;

          }

        });

        // Align the lowest point of the complete GLB model with the court.
        model.updateMatrixWorld(true);

        const modelBounds = new THREE.Box3().setFromObject(model);
        const courtFloorY = -0.15;

        model.position.y += courtFloorY - modelBounds.min.y;
        model.updateMatrixWorld(true);

        scene.add(model);

        await changeDesign(0);

      },

      xhr => {

        if (xhr.total) {

          const progress = Math.round(
            (xhr.loaded / xhr.total) * 100
          );

          status.textContent =
            'LOADING 3D MODEL ' + progress + '%';

        }

      },

      error => {

        console.error('Model loading error:', error);

        status.textContent = 'FAILED TO LOAD 3D MODEL';

      }

    );


    // =====================================
    // RESPONSIVE
    // =====================================

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });


    // =====================================
    // ANIMATION
    // =====================================

    const animationClock = new THREE.Clock();

    function animate() {

      requestAnimationFrame(animate);

      const delta = Math.min(animationClock.getDelta(), 0.05);

      controls.update();

      // Keep the court environment visually coordinated with the orbit.
      studioGroup.rotation.y =
        -controls.getAzimuthalAngle() * 0.12;

      // Clouds drift slowly from left to right and loop seamlessly.
      movingClouds.forEach(({ cloud, speed }) => {
        cloud.position.x += speed * delta;

        if (cloud.position.x > 30) {
          cloud.position.x = -30;
        }
      });

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>

</html>
