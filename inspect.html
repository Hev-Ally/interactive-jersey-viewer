
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaughn Concha | 3D Jersey Showcase</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: #f1f3f5;
      font-family: Arial, Helvetica, sans-serif;
      background: #080a0e;
    }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #viewer canvas {
      display: block;
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 45%,
          transparent 20%,
          rgba(0,0,0,0.25) 65%,
          rgba(0,0,0,0.75) 100%
        );
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 26px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(
        to bottom,
        rgba(5,7,10,0.95),
        rgba(5,7,10,0)
      );
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .brand span {
      color: #7ca9c5;
    }

    .header-label {
      color: #7e8993;
      font-size: 9px;
      letter-spacing: 3px;
    }

    .info {
      position: fixed;
      z-index: 4;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      max-width: 280px;
      pointer-events: none;
    }

    .eyebrow {
      color: #8ebbd7;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .info h1 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 0.98;
      letter-spacing: -2px;
      margin: 0 0 18px;
    }

    .line {
      width: 40px;
      height: 2px;
      background: #7ca9c5;
      margin: 22px 0;
    }

    .info p {
      color: #929da7;
      font-size: 12px;
      line-height: 1.9;
      max-width: 235px;
    }

    #status {
      position: fixed;
      z-index: 6;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: #9eabb6;
      font-size: 9px;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
    }

    .bottom-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 25px 5% 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: linear-gradient(
        to top,
        rgba(5,7,10,0.98),
        rgba(5,7,10,0.78),
        transparent
      );
    }

    .design-info {
      min-width: 140px;
    }

    .design-number {
      color: #87939e;
      font-size: 9px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    #designName {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .navigation {
      display: flex;
      gap: 10px;
    }

    .nav-button {
      min-width: 125px;
      height: 44px;
      padding: 0 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.17);
      border-radius: 3px;
      color: #f0f2f4;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.25s;
    }

    .nav-button:hover {
      background: #8ebbd7;
      color: #090d12;
      border-color: #8ebbd7;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    .tools {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .tool-button {
      height: 40px;
      padding: 0 12px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 3px;
      color: #bdc6ce;
      font-size: 9px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tool-button:hover,
    .tool-button.active {
      background: #8ebbd7;
      color: #080d12;
      border-color: #8ebbd7;
    }

    @media (max-width: 800px) {
      .header {
        padding: 20px 5%;
      }

      .header-label {
        font-size: 8px;
      }

      .info {
        top: 20%;
        left: 6%;
        transform: none;
      }

      .info h1 {
        font-size: 34px;
      }

      .info p {
        display: none;
      }

      .line {
        margin: 12px 0;
      }

      .bottom-panel {
        flex-wrap: wrap;
        justify-content: center;
        padding: 18px 5% 22px;
        gap: 14px;
      }

      .design-info {
        width: 100%;
        text-align: center;
      }

      .navigation {
        justify-content: center;
      }

      .tools {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .nav-button {
        min-width: 105px;
        padding: 0 10px;
      }

      .tool-button {
        padding: 0 9px;
      }
    }
  </style>
</head>

<body>

  <div id="viewer"></div>
  <div class="ambient-overlay"></div>

  <header class="header">
    <div class="brand">VAUGHN<span>.</span>CONCHA</div>
    <div class="header-label">3D SPORTSWEAR SHOWCASE</div>
  </header>

  <section class="info">
    <div class="eyebrow">CUSTOM UNIFORM COLLECTION</div>
    <h1>DESIGN<br>IN MOTION.</h1>
    <div class="line"></div>
    <p>
      Explore custom basketball uniform designs
      through an interactive 3D experience.
    </p>
  </section>

  <div id="status">INITIALIZING STUDIO...</div>

  <section class="bottom-panel">

    <div class="design-info">
      <div class="design-number" id="designNumber">
        DESIGN 01 / 02
      </div>
      <div id="designName">Jersey 01</div>
    </div>

    <div class="navigation">
      <button class="nav-button" id="previousBtn">
        ← PREVIOUS
      </button>

      <button class="nav-button" id="nextBtn">
        NEXT DESIGN →
      </button>
    </div>

    <div class="tools">
      <button class="tool-button" id="rotateBtn">↻ ROTATE</button>
      <button class="tool-button" id="resetBtn">RESET VIEW</button>
      <button class="tool-button" id="fullscreenBtn">⛶ FULLSCREEN</button>
    </div>

  </section>


  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


    // =====================================
    // SCENE
    // =====================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x080a0e);

    scene.fog = new THREE.Fog(0x080a0e, 8, 20);


    // =====================================
    // CAMERA
    // =====================================

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const initialCameraPosition = new THREE.Vector3(
      2.5, 1.2, 3.5
    );

    camera.position.copy(initialCameraPosition);


    // =====================================
    // RENDERER
    // =====================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 0.85;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById('viewer').appendChild(renderer.domElement);


    // =====================================
    // ORBIT CONTROLS
    // =====================================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.target.set(0, 0.9, 0);

    controls.minDistance = 1.5;

    controls.maxDistance = 8;

    controls.autoRotate = false;

    controls.autoRotateSpeed = 1.2;


    // =====================================
    // LIGHTING - DARK STUDIO
    // =====================================

    const hemisphereLight = new THREE.HemisphereLight(
      0x9eafc2,
      0x080b10,
      0.65
    );

    scene.add(hemisphereLight);


    const keyLight = new THREE.DirectionalLight(
      0xd9e5ef,
      1.7
    );

    keyLight.position.set(3, 4, 4);

    keyLight.castShadow = true;

    keyLight.shadow.mapSize.set(1024, 1024);

    scene.add(keyLight);


    const fillLight = new THREE.DirectionalLight(
      0x5c8ba9,
      0.65
    );

    fillLight.position.set(-4, 2, 3);

    scene.add(fillLight);


    const rimLight = new THREE.DirectionalLight(
      0x7daac9,
      1.3
    );

    rimLight.position.set(0, 3, -4);

    scene.add(rimLight);


    const softLight = new THREE.PointLight(
      0x466a86,
      8,
      7
    );

    softLight.position.set(0, 1, 2);

    scene.add(softLight);


    // =====================================
    // 3D STUDIO ENVIRONMENT
    // =====================================

    const studioGroup = new THREE.Group();

    scene.add(studioGroup);


    // FLOOR

    const floorGeometry = new THREE.PlaneGeometry(
      200,
      200
    );

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x090b0f,
      roughness: 0.88,
      metalness: 0.12
    });

    const floor = new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

    floor.rotation.x = -Math.PI / 2;

    floor.position.y = -0.14;

    floor.receiveShadow = true;

    scene.add(floor);


    // CIRCULAR DISPLAY PLATFORM

    const platformMaterial = new THREE.MeshStandardMaterial({
      color: 0x10151b,
      metalness: 0.72,
      roughness: 0.42
    });

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(0.78, 0.82, 0.12, 96),
      platformMaterial
    );

    platform.position.set(0, -0.06, 0);

    platform.receiveShadow = true;

    platform.castShadow = true;

    scene.add(platform);


    // PLATFORM TOP RING

    const platformRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.73, 0.009, 12, 96),
      new THREE.MeshStandardMaterial({
        color: 0x527c99,
        emissive: 0x193449,
        emissiveIntensity: 0.55,
        metalness: 0.8,
        roughness: 0.3
      })
    );

    platformRing.rotation.x = Math.PI / 2;

    platformRing.position.y = 0.005;

    scene.add(platformRing);


    // PLATFORM LOWER RING

    const lowerRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.80, 0.012, 12, 96),
      new THREE.MeshStandardMaterial({
        color: 0x263b4d,
        emissive: 0x102333,
        emissiveIntensity: 0.5,
        metalness: 0.8,
        roughness: 0.35
      })
    );

    lowerRing.rotation.x = Math.PI / 2;

    lowerRing.position.y = -0.11;

    scene.add(lowerRing);


    // =====================================
    // BACK WALL
    // =====================================

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x0b0e13,
      metalness: 0.5,
      roughness: 0.75
    });

    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 8),
      wallMaterial
    );

    wall.position.set(0, 2.2, -3.5);

    studioGroup.add(wall);


    // BACKGROUND RINGS

    const ringMaterial = new THREE.MeshStandardMaterial({
      color: 0x263d50,
      metalness: 0.85,
      roughness: 0.32,
      emissive: 0x071522,
      emissiveIntensity: 0.35
    });

    function createBackdropRing(radius, thickness, y) {

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
          radius,
          thickness,
          12,
          128
        ),
        ringMaterial
      );

      ring.position.set(0, y, -3.35);

      studioGroup.add(ring);

      return ring;

    }

    const outerRing = createBackdropRing(1.85, 0.018, 1.05);

    const middleRing = createBackdropRing(1.55, 0.009, 1.05);

    const innerRing = createBackdropRing(1.25, 0.006, 1.05);


    // SIDE METAL PANELS

    const panelMaterial = new THREE.MeshStandardMaterial({
      color: 0x151c24,
      metalness: 0.8,
      roughness: 0.5
    });

    function createPanel(x, y, z, width, height) {

      const panel = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, 0.06),
        panelMaterial
      );

      panel.position.set(x, y, z);

      studioGroup.add(panel);

    }

    createPanel(-2.5, 1.4, -2.9, 0.12, 3.2);

    createPanel(2.5, 1.4, -2.9, 0.12, 3.2);

    createPanel(-2.9, 1.4, -2.8, 0.04, 2.7);

    createPanel(2.9, 1.4, -2.8, 0.04, 2.7);


    // VERTICAL ACCENT LIGHTS

    const accentMaterial = new THREE.MeshBasicMaterial({
      color: 0x345b76
    });

    function createAccent(x, y, z, height) {

      const accent = new THREE.Mesh(
        new THREE.BoxGeometry(0.018, height, 0.025),
        accentMaterial
      );

      accent.position.set(x, y, z);

      studioGroup.add(accent);

    }

    createAccent(-2.43, 1.4, -2.82, 2.6);

    createAccent(2.43, 1.4, -2.82, 2.6);


    // BACKGROUND LIGHTS

    const leftGlow = new THREE.PointLight(
      0x315a78,
      9,
      6
    );

    leftGlow.position.set(-2.5, 1.5, -2.1);

    scene.add(leftGlow);


    const rightGlow = new THREE.PointLight(
      0x315a78,
      9,
      6
    );

    rightGlow.position.set(2.5, 1.5, -2.1);

    scene.add(rightGlow);


    // =====================================
    // MODEL AND DESIGNS
    // =====================================

    const modelPath = './assets/Basketball+Kit.glb';

    const designs = [

      {
        name: 'Jersey 01',
        top: './assets/top.png',
        short: './assets/short.png'
      },

      {
        name: 'Jersey 02',
        top: './assets/top2.png',
        short: './assets/short2.png'
      }

    ];


    let model = null;

    let currentDesign = 0;

    let isChangingDesign = false;

    const textureCache = new Map();

    const textureLoader = new THREE.TextureLoader();

    const gltfLoader = new GLTFLoader();


    // =====================================
    // UI ELEMENTS
    // =====================================

    const status = document.getElementById('status');

    const designName = document.getElementById('designName');

    const designNumber = document.getElementById('designNumber');

    const previousBtn = document.getElementById('previousBtn');

    const nextBtn = document.getElementById('nextBtn');

    const rotateBtn = document.getElementById('rotateBtn');

    const resetBtn = document.getElementById('resetBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');


    // =====================================
    // TEXTURE LOADER
    // =====================================

    function loadTexture(path) {

      if (textureCache.has(path)) {

        return Promise.resolve(textureCache.get(path));

      }

      return new Promise((resolve, reject) => {

        textureLoader.load(

          path,

          texture => {

            texture.colorSpace = THREE.SRGBColorSpace;

            texture.flipY = false;

            texture.anisotropy =
              renderer.capabilities.getMaxAnisotropy();

            texture.needsUpdate = true;

            textureCache.set(path, texture);

            resolve(texture);

          },

          undefined,

          error => reject(error)

        );

      });

    }


    // =====================================
    // APPLY TEXTURE
    // =====================================

    function applyTexture(meshName, texture) {

      let found = false;

      model.traverse(object => {

        if (object.name === meshName) {

          found = true;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {

            material.map = texture;

            material.needsUpdate = true;

          });

        }

      });

      if (!found) {

        throw new Error('Mesh not found: ' + meshName);

      }

    }


    // =====================================
    // CHANGE DESIGN
    // =====================================

    async function changeDesign(index) {

      if (isChangingDesign || !model) return;

      isChangingDesign = true;

      previousBtn.disabled = true;

      nextBtn.disabled = true;

      status.textContent = 'LOADING DESIGN...';

      const selectedDesign = designs[index];

      try {

        const [topTexture, shortTexture] = await Promise.all([

          loadTexture(selectedDesign.top),

          loadTexture(selectedDesign.short)

        ]);

        applyTexture('3Jersey', topTexture);

        applyTexture('4Short', shortTexture);

        currentDesign = index;

        designName.textContent = selectedDesign.name;

        designNumber.textContent =
          'DESIGN ' +
          String(index + 1).padStart(2, '0') +
          ' / ' +
          String(designs.length).padStart(2, '0');

        status.textContent = 'DESIGN SUCCESSFULLY LOADED';

      } catch (error) {

        console.error('Texture loading error:', error);

        status.textContent = 'ERROR LOADING DESIGN - CHECK FILES';

      }

      previousBtn.disabled = false;

      nextBtn.disabled = false;

      isChangingDesign = false;

    }


    // =====================================
    // PREVIOUS / NEXT
    // =====================================

    previousBtn.addEventListener('click', () => {

      const index =
        (currentDesign - 1 + designs.length) % designs.length;

      changeDesign(index);

    });


    nextBtn.addEventListener('click', () => {

      const index =
        (currentDesign + 1) % designs.length;

      changeDesign(index);

    });


    // =====================================
    // AUTO ROTATION
    // =====================================

    rotateBtn.addEventListener('click', () => {

      controls.autoRotate = !controls.autoRotate;

      rotateBtn.classList.toggle(
        'active',
        controls.autoRotate
      );

      rotateBtn.textContent = controls.autoRotate
        ? 'Ⅱ PAUSE'
        : '↻ ROTATE';

    });


    // =====================================
    // RESET CAMERA
    // =====================================

    resetBtn.addEventListener('click', () => {

      camera.position.copy(initialCameraPosition);

      controls.target.set(0, 0.9, 0);

      controls.update();

    });


    // =====================================
    // FULLSCREEN
    // =====================================

    fullscreenBtn.addEventListener('click', async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error('Fullscreen error:', error);

      }

    });


    document.addEventListener('fullscreenchange', () => {

      fullscreenBtn.textContent = document.fullscreenElement
        ? '✕ EXIT FULL'
        : '⛶ FULLSCREEN';

    });


    // =====================================
    // LOAD MODEL
    // =====================================

    gltfLoader.load(

      modelPath,

      async gltf => {

        model = gltf.scene;

        model.traverse(object => {

          if (object.isMesh) {

            object.castShadow = true;

            object.receiveShadow = true;

          }

        });

        scene.add(model);

        await changeDesign(0);

      },

      xhr => {

        if (xhr.total) {

          const progress = Math.round(
            (xhr.loaded / xhr.total) * 100
          );

          status.textContent =
            'LOADING 3D MODEL ' + progress + '%';

        }

      },

      error => {

        console.error('Model loading error:', error);

        status.textContent = 'FAILED TO LOAD 3D MODEL';

      }

    );


    // =====================================
    // RESPONSIVE
    // =====================================

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });


    // =====================================
    // ANIMATION
    // =====================================

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      // Subtle background movement synchronized
      // with the camera's horizontal orbit.

      studioGroup.rotation.y =
        -controls.getAzimuthalAngle() * 0.12;

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>

</html>
