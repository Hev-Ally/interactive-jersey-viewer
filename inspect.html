<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaughn Concha | 3D Jersey Showcase</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: #253440;
      font-family: Arial, Helvetica, sans-serif;
      background: #a9ccdc;
    }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #viewer canvas {
      display: block;
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 45%,
        transparent 35%,
        rgba(35, 55, 65, 0.08) 80%,
        rgba(35, 55, 65, 0.2) 100%
      );
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 26px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(
        to bottom,
        rgba(235, 243, 246, 0.92),
        rgba(235, 243, 246, 0)
      );
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #243b4a;
    }

    .brand span {
      color: #6b9fbb;
    }

    .header-label {
      color: #536d7c;
      font-size: 9px;
      letter-spacing: 3px;
    }

    .info {
      position: fixed;
      z-index: 4;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      max-width: 280px;
      pointer-events: none;
    }

    .eyebrow {
      color: #426f89;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .info h1 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 0.98;
      letter-spacing: -2px;
      margin: 0 0 18px;
      color: #233b49;
    }

    .line {
      width: 40px;
      height: 2px;
      background: #699db8;
      margin: 22px 0;
    }

    .info p {
      color: #526875;
      font-size: 12px;
      line-height: 1.9;
      max-width: 235px;
    }

    #status {
      position: fixed;
      z-index: 6;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: #405d6d;
      font-size: 9px;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
    }

    .bottom-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 25px 5% 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: linear-gradient(
        to top,
        rgba(235, 243, 246, 0.97),
        rgba(235, 243, 246, 0.78),
        transparent
      );
    }

    .design-info {
      min-width: 140px;
    }

    .design-number {
      color: #637b89;
      font-size: 9px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    #designName {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #263f4e;
    }

    .navigation {
      display: flex;
      gap: 10px;
    }

    .nav-button {
      min-width: 125px;
      height: 44px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(48, 75, 91, 0.25);
      border-radius: 3px;
      color: #304b5b;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.25s;
    }

    .nav-button:hover {
      background: #729fba;
      color: #ffffff;
      border-color: #729fba;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    .tools {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .tool-button {
      height: 40px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(48, 75, 91, 0.2);
      border-radius: 3px;
      color: #425d6b;
      font-size: 9px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tool-button:hover,
    .tool-button.active {
      background: #729fba;
      color: #ffffff;
      border-color: #729fba;
    }

    @media (max-width: 800px) {
      .header {
        padding: 20px 5%;
      }

      .header-label {
        font-size: 8px;
      }

      .info {
        top: 20%;
        left: 6%;
        transform: none;
      }

      .info h1 {
        font-size: 34px;
      }

      .info p {
        display: none;
      }

      .line {
        margin: 12px 0;
      }

      .bottom-panel {
        flex-wrap: wrap;
        justify-content: center;
        padding: 18px 5% 22px;
        gap: 14px;
      }

      .design-info {
        width: 100%;
        text-align: center;
      }

      .navigation {
        justify-content: center;
      }

      .tools {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .nav-button {
        min-width: 105px;
        padding: 0 10px;
      }

      .tool-button {
        padding: 0 9px;
      }
    }
  </style>
</head>

<body>

  <div id="viewer"></div>
  <div class="ambient-overlay"></div>

  <header class="header">
    <div class="brand">VAUGHN<span>.</span>CONCHA</div>
    <div class="header-label">3D SPORTSWEAR SHOWCASE</div>
  </header>

  <section class="info">
    <div class="eyebrow">CUSTOM UNIFORM COLLECTION</div>
    <h1>DESIGN<br>IN MOTION.</h1>
    <div class="line"></div>
    <p>
      Explore custom basketball uniform designs
      through an interactive 3D experience.
    </p>
  </section>

  <div id="status">INITIALIZING COURT...</div>

  <section class="bottom-panel">

    <div class="design-info">
      <div class="design-number" id="designNumber">
        DESIGN 01 / 02
      </div>
      <div id="designName">Jersey 01</div>
    </div>

    <div class="navigation">
      <button class="nav-button" id="previousBtn">
        ← PREVIOUS
      </button>

      <button class="nav-button" id="nextBtn">
        NEXT DESIGN →
      </button>
    </div>

    <div class="tools">
      <button class="tool-button" id="rotateBtn">↻ ROTATE</button>
      <button class="tool-button" id="resetBtn">RESET VIEW</button>
      <button class="tool-button" id="fullscreenBtn">⛶ FULLSCREEN</button>
    </div>

  </section>


  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


    // =====================================
    // SCENE
    // =====================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0xa9ccdc);

    scene.fog = new THREE.Fog(0xa9ccdc, 24, 55);


    // =====================================
    // CAMERA
    // =====================================

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      150
    );

    const initialCameraPosition = new THREE.Vector3(
      2.5, 1.2, 3.5
    );

    camera.position.copy(initialCameraPosition);


    // =====================================
    // RENDERER
    // =====================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 0.95;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById('viewer').appendChild(renderer.domElement);


    // =====================================
    // ORBIT CONTROLS
    // =====================================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.target.set(0, 0.9, 0);

    controls.minDistance = 1.5;

    controls.maxDistance = 12;

    controls.autoRotate = false;

    controls.autoRotateSpeed = 1.2;


    // =====================================
    // LIGHTING - LATE AFTERNOON
    // =====================================

    const hemisphereLight = new THREE.HemisphereLight(
      0xc8e7f5,
      0x8c806c,
      1.15
    );

    scene.add(hemisphereLight);


    const keyLight = new THREE.DirectionalLight(
      0xffe0b5,
      2.0
    );

    keyLight.position.set(-5, 8, 5);

    keyLight.castShadow = true;

    keyLight.shadow.mapSize.set(2048, 2048);

    keyLight.shadow.camera.left = -12;

    keyLight.shadow.camera.right = 12;

    keyLight.shadow.camera.top = 12;

    keyLight.shadow.camera.bottom = -12;

    keyLight.shadow.bias = -0.0005;

    scene.add(keyLight);


    const fillLight = new THREE.DirectionalLight(
      0x9bc9e3,
      0.55
    );

    fillLight.position.set(5, 4, 4);

    scene.add(fillLight);


    const rimLight = new THREE.DirectionalLight(
      0xffd6a0,
      0.75
    );

    rimLight.position.set(0, 5, -5);

    scene.add(rimLight);


    const softLight = new THREE.PointLight(
      0xffd9ae,
      3,
      12
    );

    softLight.position.set(0, 3, 2);

    scene.add(softLight);


    // =====================================
    // OUTDOOR ENVIRONMENT GROUP
    // =====================================

    const studioGroup = new THREE.Group();

    scene.add(studioGroup);


    // =====================================
    // OUTDOOR GROUND
    // =====================================

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x8b9f82,
      roughness: 1,
      metalness: 0
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;

    ground.position.y = -0.24;

    ground.receiveShadow = true;

    studioGroup.add(ground);


    // =====================================
    // COURT FLOOR
    // =====================================

    const courtMaterial = new THREE.MeshStandardMaterial({
      color: 0x9dbfca,
      roughness: 0.92,
      metalness: 0.02
    });

    const court = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 34),
      courtMaterial
    );

    court.rotation.x = -Math.PI / 2;

    court.position.y = -0.15;

    court.receiveShadow = true;

    studioGroup.add(court);


    // =====================================
    // COURT MARKINGS
    // =====================================

    const lineMaterial = new THREE.MeshBasicMaterial({
      color: 0xf5f0df
    });


    function createCourtLine(points) {

      const geometry = new THREE.BufferGeometry();

      geometry.setFromPoints(
        points.map(p => new THREE.Vector3(p[0], -0.135, p[1]))
      );

      const line = new THREE.Line(
        geometry,
        lineMaterial
      );

      studioGroup.add(line);

      return line;

    }


    function createRectangle(x, z, width, depth) {

      createCourtLine([
        [x, z],
        [x + width, z],
        [x + width, z + depth],
        [x, z + depth],
        [x, z]
      ]);

    }


    // Outer boundary

    createRectangle(-9, -16, 18, 32);


    // Center line

    createCourtLine([
      [-9, 0],
      [9, 0]
    ]);


    // Center circle

    const centerCircle = new THREE.Mesh(
      new THREE.TorusGeometry(1.8, 0.018, 8, 96),
      lineMaterial
    );

    centerCircle.rotation.x = Math.PI / 2;

    centerCircle.position.set(0, -0.13, 0);

    studioGroup.add(centerCircle);


    // Basketball keys

    createRectangle(-3, -15, 6, 5.5);

    createRectangle(-3, 9.5, 6, 5.5);


    // Free throw circles

    [-9.5, 9.5].forEach(z => {

      const circle = new THREE.Mesh(
        new THREE.TorusGeometry(1.8, 0.018, 8, 64),
        lineMaterial
      );

      circle.rotation.x = Math.PI / 2;

      circle.position.set(0, -0.13, z);

      studioGroup.add(circle);

    });


    // =====================================
    // BASKETBALL HOOPS
    // =====================================

    const poleMaterial = new THREE.MeshStandardMaterial({
      color: 0x46545b,
      metalness: 0.65,
      roughness: 0.4
    });

    const backboardMaterial = new THREE.MeshStandardMaterial({
      color: 0xe8edf0,
      roughness: 0.35,
      metalness: 0.1
    });

    const rimMaterial = new THREE.MeshStandardMaterial({
      color: 0xe77d46,
      metalness: 0.4,
      roughness: 0.4
    });


    function createHoop(zDirection) {

      const hoop = new THREE.Group();

      const z = zDirection * 1;


      // Pole

      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.075, 0.1, 3.5, 16),
        poleMaterial
      );

      pole.position.set(0, 1.6, z * 15.1);

      hoop.add(pole);


      // Support arm

      const support = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.1, 1.0),
        poleMaterial
      );

      support.position.set(0, 3.0, z * 14.65);

      hoop.add(support);


      // Backboard

      const backboard = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 1.05, 0.08),
        backboardMaterial
      );

      backboard.position.set(0, 3.2, z * 14.25);

      hoop.add(backboard);


      // Target rectangle

      const target = new THREE.Mesh(
        new THREE.BoxGeometry(0.65, 0.42, 0.015),
        new THREE.MeshBasicMaterial({
          color: 0x7799a8
        })
      );

      target.position.set(0, 3.08, z * 14.19);

      hoop.add(target);


      // Rim

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.24, 0.025, 12, 48),
        rimMaterial
      );

      rim.rotation.x = Math.PI / 2;

      rim.position.set(0, 2.85, z * 13.9);

      hoop.add(rim);


      studioGroup.add(hoop);

    }


    createHoop(-1);

    createHoop(1);


    // =====================================
    // OUTDOOR FENCING
    // =====================================

    const fenceMaterial = new THREE.MeshStandardMaterial({
      color: 0x879ca5,
      metalness: 0.55,
      roughness: 0.7
    });


    function createFencePost(x, z) {

      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 4, 8),
        fenceMaterial
      );

      post.position.set(x, 1.85, z);

      studioGroup.add(post);

    }


    // Side fence posts

    for (let z = -15; z <= 15; z += 3) {

      createFencePost(-9.5, z);

      createFencePost(9.5, z);

    }


    // Horizontal fence rails

    [-9.5, 9.5].forEach(x => {

      [0.5, 2, 3.5].forEach(y => {

        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(0.045, 0.045, 30),
          fenceMaterial
        );

        rail.position.set(x, y, 0);

        studioGroup.add(rail);

      });

    });


    // =====================================
    // OUTDOOR TREES
    // =====================================

    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0x78604c
    });

    const leafMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0x718e75,
        roughness: 1
      }),
      new THREE.MeshStandardMaterial({
        color: 0x8ca17d,
        roughness: 1
      })
    ];


    function createTree(x, z, scale = 1) {

      const tree = new THREE.Group();

      tree.position.set(x, 0, z);

      tree.scale.setScalar(scale);


      // Tree trunk

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.18, 2.2, 10),
        trunkMaterial
      );

      trunk.position.y = 1.1;

      trunk.castShadow = true;

      tree.add(trunk);


      // Tree foliage

      const leaves = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1, 1),
        leafMaterials[Math.abs(Math.round(x + z)) % 2]
      );

      leaves.position.y = 2.5;

      leaves.scale.set(1.1, 1.35, 1.1);

      leaves.castShadow = true;

      tree.add(leaves);

      studioGroup.add(tree);

    }


    // Left trees

    createTree(-12, -11, 1.5);

    createTree(-13, -4, 1.2);

    createTree(-12, 5, 1.4);

    createTree(-12, 13, 1.3);


    // Right trees

    createTree(12, -10, 1.4);

    createTree(13, -2, 1.3);

    createTree(12, 7, 1.5);

    createTree(12, 14, 1.2);


    // =====================================
    // DISTANT SUN
    // =====================================

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffe2ad
      })
    );

    sun.position.set(-7, 7, -18);

    studioGroup.add(sun);


    // =====================================
    // OUTDOOR ENVIRONMENT LIGHTS
    // =====================================

    const leftGlow = new THREE.PointLight(
      0xb4d5e3,
      2,
      12
    );

    leftGlow.position.set(-7, 3, -5);

    studioGroup.add(leftGlow);


    const rightGlow = new THREE.PointLight(
      0xffd5a4,
      2,
      12
    );

    rightGlow.position.set(7, 3, -5);

    studioGroup.add(rightGlow);


    // =====================================
    // MODEL AND DESIGNS
    // =====================================

    const modelPath = './assets/Basketball+Kit.glb';

    const designs = [

      {
        name: 'Jersey 01',
        top: './assets/top.png',
        short: './assets/short.png'
      },

      {
        name: 'Jersey 02',
        top: './assets/top2.png',
        short: './assets/short2.png'
      }

    ];


    let model = null;

    let currentDesign = 0;

    let isChangingDesign = false;

    const textureCache = new Map();

    const textureLoader = new THREE.TextureLoader();

    const gltfLoader = new GLTFLoader();


    // =====================================
    // UI ELEMENTS
    // =====================================

    const status = document.getElementById('status');

    const designName = document.getElementById('designName');

    const designNumber = document.getElementById('designNumber');

    const previousBtn = document.getElementById('previousBtn');

    const nextBtn = document.getElementById('nextBtn');

    const rotateBtn = document.getElementById('rotateBtn');

    const resetBtn = document.getElementById('resetBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');


    // =====================================
    // TEXTURE LOADER
    // =====================================

    function loadTexture(path) {

      if (textureCache.has(path)) {

        return Promise.resolve(textureCache.get(path));

      }

      return new Promise((resolve, reject) => {

        textureLoader.load(

          path,

          texture => {

            texture.colorSpace = THREE.SRGBColorSpace;

            texture.flipY = false;

            texture.anisotropy =
              renderer.capabilities.getMaxAnisotropy();

            texture.needsUpdate = true;

            textureCache.set(path, texture);

            resolve(texture);

          },

          undefined,

          error => reject(error)

        );

      });

    }


    // =====================================
    // APPLY TEXTURE
    // =====================================

    function applyTexture(meshName, texture) {

      let found = false;

      model.traverse(object => {

        if (object.name === meshName) {

          found = true;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {

            material.map = texture;

            material.needsUpdate = true;

          });

        }

      });

      if (!found) {

        throw new Error('Mesh not found: ' + meshName);

      }

    }


    // =====================================
    // CHANGE DESIGN
    // =====================================

    async function changeDesign(index) {

      if (
        isChangingDesign ||
        !model ||
        index < 0 ||
        index >= designs.length
      ) return;

      isChangingDesign = true;

      previousBtn.disabled = true;

      nextBtn.disabled = true;

      status.textContent = 'LOADING DESIGN...';

      const selectedDesign = designs[index];

      try {

        const [topTexture, shortTexture] = await Promise.all([

          loadTexture(selectedDesign.top),

          loadTexture(selectedDesign.short)

        ]);

        applyTexture('3Jersey', topTexture);

        applyTexture('4Short', shortTexture);

        currentDesign = index;

        designName.textContent = selectedDesign.name;

        designNumber.textContent =
          'DESIGN ' +
          String(index + 1).padStart(2, '0') +
          ' / ' +
          String(designs.length).padStart(2, '0');

        status.textContent = 'DESIGN SUCCESSFULLY LOADED';

      } catch (error) {

        console.error('Texture loading error:', error);

        status.textContent = 'ERROR LOADING DESIGN - CHECK FILES';

      }

      previousBtn.disabled = false;

      nextBtn.disabled = false;

      isChangingDesign = false;

    }


    // =====================================
    // PREVIOUS / NEXT
    // =====================================

    previousBtn.addEventListener('click', () => {

      const index =
        (currentDesign - 1 + designs.length) % designs.length;

      changeDesign(index);

    });


    nextBtn.addEventListener('click', () => {

      const index =
        (currentDesign + 1) % designs.length;

      changeDesign(index);

    });


    // =====================================
    // AUTO ROTATION
    // =====================================

    rotateBtn.addEventListener('click', () => {

      controls.autoRotate = !controls.autoRotate;

      rotateBtn.classList.toggle(
        'active',
        controls.autoRotate
      );

      rotateBtn.textContent = controls.autoRotate
        ? 'Ⅱ PAUSE'
        : '↻ ROTATE';

    });


    // =====================================
    // RESET CAMERA
    // =====================================

    resetBtn.addEventListener('click', () => {

      camera.position.copy(initialCameraPosition);

      controls.target.set(0, 0.9, 0);

      controls.update();

    });


    // =====================================
    // FULLSCREEN
    // =====================================

    fullscreenBtn.addEventListener('click', async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error('Fullscreen error:', error);

      }

    });


    document.addEventListener('fullscreenchange', () => {

      fullscreenBtn.textContent = document.fullscreenElement
        ? '✕ EXIT FULL'
        : '⛶ FULLSCREEN';

    });


    // =====================================
    // LOAD MODEL
    // =====================================

    gltfLoader.load(

      modelPath,

      async gltf => {

        model = gltf.scene;

        model.traverse(object => {

          if (object.isMesh) {

            object.castShadow = true;

            object.receiveShadow = true;

          }

        });

        // Align the bottom of the full model with the court floor.
        model.updateMatrixWorld(true);
        const modelBounds = new THREE.Box3().setFromObject(model);
        const courtFloorY = -0.15;
        model.position.y += courtFloorY - modelBounds.min.y;
        model.updateMatrixWorld(true);

        scene.add(model);

        await changeDesign(0);

      },

      xhr => {

        if (xhr.total) {

          const progress = Math.round(
            (xhr.loaded / xhr.total) * 100
          );

          status.textContent =
            'LOADING 3D MODEL ' + progress + '%';

        }

      },

      error => {

        console.error('Model loading error:', error);

        status.textContent = 'FAILED TO LOAD 3D MODEL';

      }

    );


    // =====================================
    // RESPONSIVE
    // =====================================

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });


    // =====================================
    // ANIMATION
    // =====================================

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      // Environment follows camera orbit subtly.

      studioGroup.rotation.y =
        -controls.getAzimuthalAngle() * 0.12;

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>

</html>
